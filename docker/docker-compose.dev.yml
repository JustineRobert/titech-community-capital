name: titech-community-capital-dev

services:
  mongo:
    image: mongo:7.0-jammy
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - titech-dev-mongo:/data/db
    command: ["mongod", "--bind_ip_all"]
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok' | grep -q 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - titech-dev-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    env_file:
      - ../backend/.env
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/community_savings
      REDIS_URL: redis://redis:6379
      CORS_ORIGINS: http://localhost:3000
      CLIENT_ORIGIN: http://localhost:3000
    ports:
      - "5000:5000"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 6

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
      args:
        VITE_API_URL: /api/v1
        VITE_SOCKET_URL: /
        VITE_APP_VERSION: ${TITECH_APP_VERSION:-1.0.0-dev}
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  titech-dev-mongo:
  titech-dev-redis:
