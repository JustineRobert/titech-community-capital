name: titech-development
services:
  mongodb:
    image: mongo:7-jammy
    ports: ["27017:27017"]
    volumes: ["mongodb_data:/data/db"]
    healthcheck:
      test: ["CMD","mongosh","--quiet","--eval","db.adminCommand({ping:1})"]
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    command: ["redis-server","--appendonly","yes"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  backend:
    build: { context: .., dockerfile: docker/backend.Dockerfile }
    environment: { NODE_ENV: development, PORT: 5000, MONGO_URI: mongodb://mongodb:27017/titech, REDIS_HOST: redis }
    ports: ["5000:5000"]
    depends_on:
      mongodb: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes: ["../backend:/app", "/app/node_modules"]
  frontend:
    build: { context: .., dockerfile: docker/frontend.Dockerfile }
    ports: ["3000:80"]
    depends_on:
      backend: { condition: service_healthy }
volumes:
  mongodb_data:
  redis_data:
