name: titech-community-capital-production

# Production composition intentionally externalizes MongoDB and Redis.
# Use MongoDB Atlas / another managed Mongo deployment and a managed Redis
# service (or an independently operated HA cluster). Do not run production
# financial state on a single-node local datastore.

services:
  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    image: ${TITECH_BACKEND_IMAGE:-ghcr.io/${TITECH_IMAGE_NAMESPACE:-titech}/titech-community-capital-backend}:${TITECH_IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - ../backend/.env.production
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 5000
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /app/tmp
      - /app/logs

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
      args:
        VITE_API_URL: /api/v1
        VITE_SOCKET_URL: /
        VITE_APP_VERSION: ${TITECH_APP_VERSION:-1.0.0}
        VITE_BUILD_TIME: ${TITECH_BUILD_TIME:-}
    image: ${TITECH_FRONTEND_IMAGE:-ghcr.io/${TITECH_IMAGE_NAMESPACE:-titech}/titech-community-capital-frontend}:${TITECH_IMAGE_TAG:-latest}
    restart: unless-stopped
    expose:
      - "80"
    security_opt:
      - no-new-privileges:true

  edge:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      TITECH_DOMAIN: ${TITECH_DOMAIN:-app.titech.co.ug}
      TITECH_TLS_CERT: ${TITECH_TLS_CERT:-/etc/nginx/tls/fullchain.pem}
      TITECH_TLS_KEY: ${TITECH_TLS_KEY:-/etc/nginx/tls/privkey.pem}
    volumes:
      - ../nginx/production.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ${TITECH_TLS_DIR:-../nginx/ssl}:/etc/nginx/tls:ro
      - titech-nginx-cache:/var/cache/nginx
      - titech-nginx-run:/var/run
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  titech-nginx-cache:
  titech-nginx-run:
