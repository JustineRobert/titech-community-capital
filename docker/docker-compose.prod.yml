name: titech-production-local
services:
  app:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/titech
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports: ["5000:5000"]
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped
    healthcheck:
      test: ["CMD","node","-e","fetch('http://127.0.0.1:5000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
  worker:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    command: ["node","queues/transaction.worker.js"]
    environment:
      NODE_ENV: production
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      redis: { condition: service_healthy }
    restart: unless-stopped
  web:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
    ports: ["3000:80"]
    depends_on:
      app: { condition: service_healthy }
    restart: unless-stopped
  mongo:
    image: mongo:7-jammy
    volumes: ["mongo-data:/data/db"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD","mongosh","--quiet","--eval","db.adminCommand({ping:1})"]
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    command: ["redis-server","--appendonly","yes"]
    volumes: ["redis-data:/data"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  mongo-data:
  redis-data:
