<!doctype html>
<html lang="en">
  <head>
    <!-- ================================================================== -->
    <!-- Document / Character Encoding                                      -->
    <!-- ================================================================== -->

    <meta charset="UTF-8" />

    <!-- ================================================================== -->
    <!-- Viewport / Mobile                                                   -->
    <!-- ================================================================== -->

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />

    <meta
      name="mobile-web-app-capable"
      content="yes"
    />

    <meta
      name="apple-mobile-web-app-capable"
      content="yes"
    />

    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="default"
    />

    <meta
      name="apple-mobile-web-app-title"
      content="TITech Community Capital"
    />

    <!-- ================================================================== -->
    <!-- Application Identity                                                -->
    <!-- ================================================================== -->

    <meta
      name="application-name"
      content="TITech Community Capital"
    />

    <meta
      name="generator"
      content="TITech Community Capital"
    />

    <meta
      name="description"
      content="TITech Community Capital — a digital community savings and financial management platform."
    />

    <meta
      name="theme-color"
      content="#2563eb"
    />

    <meta
      name="color-scheme"
      content="light dark"
    />

    <!-- ================================================================== -->
    <!-- Search / Indexing                                                   -->
    <!-- ================================================================== -->

    <meta
      name="robots"
      content="index, follow"
    />

    <meta
      name="googlebot"
      content="index, follow"
    />

    <!-- ================================================================== -->
    <!-- Security-Oriented Browser Metadata                                  -->
    <!-- ================================================================== -->

    <!--
      Referrer policy is intentionally conservative.

      For a financial application, avoid unnecessarily transmitting full
      URLs containing potentially sensitive application state.
    -->
    <meta
      name="referrer"
      content="strict-origin-when-cross-origin"
    />

    <!--
      Prevent MIME-type sniffing where supported through the corresponding
      HTTP response header.

      NOTE:
      Security response headers should ultimately be configured at the
      production server/CDN/reverse-proxy layer.
    -->

    <!-- ================================================================== -->
    <!-- Icons                                                               -->
    <!-- ================================================================== -->

    <link
      rel="icon"
      href="/images/Designer.png"
      type="image/png"
    />

    <link
      rel="apple-touch-icon"
      href="/images/Designer.png"
    />

    <!--
      Optional future favicon variants:

      <link
        rel="icon"
        href="/favicon.svg"
        type="image/svg+xml"
      />

      <link
        rel="manifest"
        href="/manifest.webmanifest"
      />
    -->

    <!-- ================================================================== -->
    <!-- Resource Hints                                                      -->
    <!-- ================================================================== -->

    <!--
      Only add preconnect/dns-prefetch entries for domains that the
      application actually uses.

      Example:

      <link
        rel="preconnect"
        href="https://api.example.com"
        crossorigin
      />
    -->

    <!-- ================================================================== -->
    <!-- Application Title                                                    -->
    <!-- ================================================================== -->

    <title>
      TITech Community Capital
    </title>
  </head>

  <body>
    <!-- ================================================================== -->
    <!-- No JavaScript fallback                                               -->
    <!-- ================================================================== -->

    <noscript>
      <div
        style="
          max-width: 720px;
          margin: 4rem auto;
          padding: 1.5rem;
          font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
          line-height: 1.6;
          color: #0f172a;
          background: #ffffff;
          border: 1px solid #e2e8f0;
          border-radius: 12px;
        "
      >
        <h1>
          JavaScript is required
        </h1>

        <p>
          TITech Community Capital requires JavaScript to provide its
          application experience. Please enable JavaScript in your browser
          and reload this page.
        </p>
      </div>
    </noscript>

    <!-- ================================================================== -->
    <!-- React Application Root                                               -->
    <!-- ================================================================== -->

    <div
      id="root"
      role="application"
      aria-label="TITech Community Capital"
    ></div>

    <!-- ================================================================== -->
    <!-- Canonical Vite Application Entry Point                               -->
    <!-- ================================================================== -->

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
