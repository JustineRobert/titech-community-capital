# LOCAL COMPOSE EXAMPLE ONLY: MongoDB/Redis authentication and production network hardening are not configured here. Do not use this file as production approval or as a production deployment pattern.
name: titech-community-capital

services:
  app:
    build: ./backend
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/app?replicaSet=rs0
      REDIS_HOST: redis
    depends_on:
      mongo:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  worker:
    build: ./backend
    command: node queues/transaction.worker.js
    environment:
      NODE_ENV: production
      MONGO_URI: mongodb://mongo:27017/app?replicaSet=rs0
      REDIS_HOST: redis
    depends_on:
      mongo:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  mongo:
    image: mongo:7-jammy
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ping:1}).ok"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  mongo-init:
    image: mongo:7-jammy
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/bash", "-lc"]
    command: >-
      until mongosh "mongodb://mongo:27017/admin?directConnection=true" --quiet --eval 'db.adminCommand({ping:1}).ok' | grep -q '^1$'; do sleep 1; done;
      mongosh "mongodb://mongo:27017/admin?directConnection=true" --quiet --eval 'try { rs.status() } catch (e) { rs.initiate({_id:"rs0",members:[{_id:0,host:"mongo:27017"}]}) }';
      until mongosh "mongodb://mongo:27017/admin?directConnection=true" --quiet --eval 'db.hello().isWritablePrimary' | grep -q 'true'; do sleep 1; done;

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  mongo-data:
  mongo-config:
  redis-data:
