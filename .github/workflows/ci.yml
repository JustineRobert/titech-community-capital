# .github/workflows/ci.yml
name: TITech Community Capital CI

on:
  push:
    branches:
      - main
      - develop
      - 'release/**'
      - 'feature/**'
      - 'hotfix/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: titech-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  CI: true
  MONGO_URI: "mongodb://127.0.0.1:27017/titech_test?replicaSet=rs0"
  MONGODB_URI: "mongodb://127.0.0.1:27017/titech_test?replicaSet=rs0"
  REDIS_URL: redis://127.0.0.1:6379
  PORT: 5000

jobs:
  # Static validation and linting
  quality:
    name: Static validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node (use .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: Pin supported npm runtime
        run: npm install --global npm@11.12.1

      - name: Enforce supported runtime and lockfile contract
        run: npm run check:runtime

      - name: Frontend runtime ownership/configuration audit
        run: npm run audit:frontend-runtime

      - name: Install dependencies (root + workspaces)
        run: |
          npm ci --include=dev
          npm ci --prefix backend --include=dev
          npm ci --prefix frontend --include=dev

      - name: Validate runtime
        run: |
          echo "Node:" $(node --version)
          echo "npm:" $(npm --version)

      - name: Check for merge conflict markers
        run: npm run check:conflicts

      - name: Repository structure gate
        run: npm run check:structure

      - name: Zero syntax errors gate
        run: npm run validate:syntax

      - name: Financial invariant/static gate
        run: npm run check:financial

      - name: Canonical runtime import audit
        run: npm run check:runtime-imports

      - name: Enterprise hosting gate
        run: npm run titech:hosting-gate

      - name: Enterprise release readiness audit
        run: npm run release:gate

      - name: Multilingual resource integrity gate
        run: npm run i18n:check

      - name: Multilingual core regression tests
        run: npm run test:i18n:native

      - name: TITech 90-day implementation gate
        run: npm run titech:90-day-gate

      - name: Upload release readiness evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-readiness
          path: reports/release-readiness.json
          retention-days: 14

      - name: Frontend runtime regression tests
        run: npm run test:frontend-runtime

      - name: Exact-money unit tests (sanity)
        run: node --test backend/tests/unit/financial/money.test.js

      - name: Lint and format
        run: npm run check

  # Unit and integration tests using transaction-capable MongoDB and persistent Redis
  tests:
    name: Unit and integration tests (supported runtime)
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node (use .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: Pin supported npm runtime
        run: npm install --global npm@11.12.1

      - name: Enforce supported runtime and lockfile contract
        run: npm run check:runtime

      - name: Install dependencies (root + workspaces)
        run: |
          npm ci --include=dev
          npm ci --prefix backend --include=dev
          npm ci --prefix frontend --include=dev

      - name: Start transaction-capable MongoDB and persistent Redis
        run: |
          docker compose -f docker-compose.validation.yml up -d
          ready=false
          for attempt in $(seq 1 60); do
            primary=$(docker compose -f docker-compose.validation.yml exec -T mongodb mongosh --quiet --eval 'db.hello().isWritablePrimary' 2>/dev/null | tail -n 1 || true)
            redis=$(docker compose -f docker-compose.validation.yml exec -T redis redis-cli ping 2>/dev/null | tail -n 1 || true)
            if [ "$primary" = "true" ] && [ "$redis" = "PONG" ]; then ready=true; break; fi
            sleep 2
          done
          if [ "$ready" != "true" ]; then
            docker compose -f docker-compose.validation.yml ps
            docker compose -f docker-compose.validation.yml logs --no-color
            exit 1
          fi
          docker compose -f docker-compose.validation.yml exec -T mongodb mongosh --quiet --eval 'assert(rs.status().myState === 1)'

      - name: Run backend tests
        run: npm run test:backend:ci

      - name: Run frontend tests
        run: npm run test:frontend:ci

      - name: Stop validation services
        if: always()
        run: docker compose -f docker-compose.validation.yml down --volumes --remove-orphans

  # Production builds (only after quality + tests)
  build:
    name: Production builds
    runs-on: ubuntu-latest
    needs: [quality, tests]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node (use .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: Pin supported npm runtime
        run: npm install --global npm@11.12.1

      - name: Enforce supported runtime and lockfile contract
        run: npm run check:runtime

      - name: Install dependencies (root + workspaces)
        run: |
          npm ci --include=dev
          npm ci --prefix backend --include=dev
          npm ci --prefix frontend --include=dev

      - name: Build backend
        run: npm run build:backend

      - name: Build frontend
        run: npm run build:frontend

  # Dependency security audit
  security:
    name: Dependency security
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node (use .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: Pin supported npm runtime
        run: npm install --global npm@11.12.1

      - name: Enforce supported runtime and lockfile contract
        run: npm run check:runtime

      - name: Install dependencies (root + workspaces)
        run: |
          npm ci --include=dev
          npm ci --prefix backend --include=dev
          npm ci --prefix frontend --include=dev

      - name: Audit dependencies (high severity)
        run: |
          npm audit --audit-level=high
          npm audit --prefix backend --audit-level=high
          npm audit --prefix frontend --audit-level=high

  # OSV scan
  osv:
    name: OSV dependency scan
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run OSV scanner
        uses: google/osv-scanner-action/osv-scanner-action@v2.0.2
        with:
          scan-args: |
            --lockfile=package-lock.json --lockfile=backend/package-lock.json --lockfile=frontend/package-lock.json

  # Trivy filesystem scan
  trivy:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    needs: [quality]
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Trivy scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'

  # CodeQL analysis
  codeql:
    name: CodeQL analysis
    runs-on: ubuntu-latest
    needs: [quality]
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript

      - name: Run CodeQL analysis
        uses: github/codeql-action/analyze@v3
