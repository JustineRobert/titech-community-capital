################################################################################
# TITech Community Capital LTD
# Enterprise CI/CD Pipeline
#
# File:
#   .github/workflows/ci-cd.yml
#
# Canonical project structure:
#
#   backend/
#   frontend/
#   deployment/
#     charts/
#       backend/
#       frontend/
#
# Pipeline:
#
#   Pull Request / Branch
#          │
#          ▼
#      QUALITY
#          │
#          ├── Backend lint
#          ├── Frontend lint
#          ├── Formatting
#          └── Type validation
#          │
#          ▼
#     BACKEND TESTS ────── FRONTEND TESTS
#          │                     │
#          └──────────┬──────────┘
#                     ▼
#                  SECURITY
#                     │
#                     ├── npm audit
#                     ├── Dependency Review
#                     ├── CodeQL
#                     ├── Trivy
#                     ├── Gitleaks
#                     └── SBOM
#                     │
#                     ▼
#             BUILD + CONTAINERS
#                     │
#                     ├── Backend image
#                     ├── Frontend image
#                     ├── SBOM
#                     ├── Provenance
#                     └── Cosign
#                     │
#                     ▼
#                  STAGING
#                     │
#                     ├── Migration
#                     ├── Helm atomic deploy
#                     ├── Rollout verification
#                     └── API smoke test
#                     │
#                     ▼
#                PRODUCTION
#              (protected env)
#                     │
#                     ├── Migration
#                     ├── Helm atomic deploy
#                     ├── Rollout verification
#                     └── API smoke test
#                     │
#                     ▼
#            POST-DEPLOYMENT
#                     │
#                     ├── API
#                     ├── Frontend
#                     ├── Kubernetes
#                     ├── Prometheus
#                     └── Grafana
#
# Deployment policy:
#
#   Pull Request             → CI only
#   Scheduled run            → CI/security only
#   develop/main push        → CI + build + staging
#   release/hotfix push      → CI + build + staging
#   version tag v*           → CI + build + staging + production
#   manual staging           → CI + build + staging
#   manual production        → CI + build + staging + production
#
################################################################################

name: TITech Enterprise CI/CD Pipeline

################################################################################
# WORKFLOW TRIGGERS
################################################################################

on:

  push:

    branches:
      - main
      - develop
      - release/**
      - hotfix/**

    tags:
      - "v*"

  pull_request:

    branches:
      - main
      - develop

  workflow_dispatch:

    inputs:

      environment:

        description: Deployment environment

        required: true

        type: choice

        default: staging

        options:
          - staging
          - production

  schedule:

    # Weekly dependency/security validation.
    #
    # IMPORTANT:
    # Deployment jobs explicitly reject scheduled executions.
    - cron: "0 3 * * 1"

################################################################################
# DEFAULT TOKEN PERMISSIONS
################################################################################
#
# Least privilege by default.
# Jobs elevate permissions only when required.
#
################################################################################

permissions:

  contents: read

################################################################################
# WORKFLOW CONCURRENCY
################################################################################

concurrency:

  group: >
    titech-cicd-${{ github.workflow }}-${{ github.ref }}

  # Cancel stale branch/PR builds.
  # Production has its own concurrency group below.
  cancel-in-progress: true

################################################################################
# GLOBAL ENVIRONMENT
################################################################################

env:

  ##########################################################################
  # Application identity
  ##########################################################################

  APPLICATION_NAME: community-savings-app

  COMPANY_NAME: TITech Community Capital LTD

  ORGANIZATION: titech

  ##########################################################################
  # Node / npm
  ##########################################################################

  NODE_VERSION: "24.15.0"

  NODE_ENV: production

  CI: true

  ##########################################################################
  # Canonical directories
  ##########################################################################

  ROOT_DIR: .

  BACKEND_DIR: backend

  FRONTEND_DIR: frontend

  DOCS_DIR: docs

  REPORTS_DIR: reports

  COVERAGE_DIR: coverage

  ##########################################################################
  # Container registry
  ##########################################################################

  REGISTRY: ghcr.io

  IMAGE_NAMESPACE: ${{ github.repository_owner }}

  BACKEND_IMAGE: community-savings-backend

  FRONTEND_IMAGE: community-savings-frontend

  # Immutable logical deployment tag.
  IMAGE_TAG: ${{ github.sha }}

  DOCKER_BUILDKIT: "1"

  ##########################################################################
  # Kubernetes namespaces
  ##########################################################################

  K8S_NAMESPACE_STAGING: community-staging

  K8S_NAMESPACE_PRODUCTION: community-production

  ##########################################################################
  # Test infrastructure
  ##########################################################################

  TEST_MONGO_URI: mongodb://127.0.0.1:27017/community_savings_test

  TEST_REDIS_URL: redis://127.0.0.1:6379

  ##########################################################################
  # Quality policy
  ##########################################################################

  COVERAGE_THRESHOLD: "85"

  ##########################################################################
  # Artifact retention
  ##########################################################################

  ARTIFACT_RETENTION_DAYS: "30"

################################################################################
# DEFAULT SHELL
################################################################################

defaults:

  run:

    shell: bash

################################################################################
# JOBS
################################################################################

jobs:

  ##############################################################################
  # 01. QUALITY
  ##############################################################################

  quality:

    name: Quality • Lint • Formatting • Validation

    runs-on: ubuntu-latest

    timeout-minutes: 30

    permissions:

      contents: read

    steps:

      ##########################################################################
      # Checkout
      ##########################################################################

      - name: Checkout Repository

        uses: actions/checkout@v4

        with:

          fetch-depth: 0

          submodules: recursive

      ##########################################################################
      # Node
      ##########################################################################

      - name: Setup Node.js

        uses: actions/setup-node@v4

        with:

          node-version: ${{ env.NODE_VERSION }}

          cache: npm

          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      ##########################################################################
      # npm cache
      ##########################################################################

      - name: Restore npm Cache

        uses: actions/cache@v4

        with:

          path: |
            ~/.npm

          key: >
            ${{ runner.os }}-
            node-${{ env.NODE_VERSION }}-
            ${{ hashFiles(
              'package-lock.json',
              'backend/package-lock.json',
              'frontend/package-lock.json'
            ) }}

          restore-keys: |
            ${{ runner.os }}-node-${{ env.NODE_VERSION }}-

      ##########################################################################
      # Root dependencies
      ##########################################################################

      - name: Install Root Dependencies

        run: npm ci

      ##########################################################################
      # Backend dependencies
      ##########################################################################

      - name: Install Backend Dependencies

        working-directory: ${{ env.BACKEND_DIR }}

        run: npm ci

      ##########################################################################
      # Frontend dependencies
      ##########################################################################

      - name: Install Frontend Dependencies

        working-directory: ${{ env.FRONTEND_DIR }}

        run: npm ci

      ##########################################################################
      # Validate package.json files
      ##########################################################################

      - name: Validate Package Files

        run: |

          node <<'NODE'
          const fs = require("fs");

          const files = [
            "package.json",
            "backend/package.json",
            "frontend/package.json"
          ];

          for (const file of files) {
            if (!fs.existsSync(file)) {
              console.error(`Required file missing: ${file}`);
              process.exit(1);
            }

            JSON.parse(fs.readFileSync(file, "utf8"));

            console.log(`Validated: ${file}`);
          }
          NODE

      ##########################################################################
      # Validate canonical structure
      ##########################################################################

      - name: Validate Canonical Project Structure

        run: |

          test -d backend
          test -d frontend

          test -f backend/package.json
          test -f frontend/package.json

          test -f backend/package-lock.json
          test -f frontend/package-lock.json

          echo "Canonical backend/ and frontend/ structure verified."

      ##########################################################################
      # Backend lint
      ##########################################################################

      - name: Backend ESLint

        working-directory: ${{ env.BACKEND_DIR }}

        run: |

          node <<'NODE'
          const pkg = require("./package.json");

          if (!pkg.scripts?.lint) {
            console.error(
              "ERROR: backend/package.json must define a lint script."
            );

            process.exit(1);
          }
          NODE

          npm run lint

      ##########################################################################
      # Frontend lint
      ##########################################################################

      - name: Frontend ESLint

        working-directory: ${{ env.FRONTEND_DIR }}

        run: |

          node <<'NODE'
          const pkg = require("./package.json");

          if (!pkg.scripts?.lint) {
            console.error(
              "ERROR: frontend/package.json must define a lint script."
            );

            process.exit(1);
          }
          NODE

          npm run lint

      ##########################################################################
      # Formatting
      ##########################################################################

      - name: Verify Formatting

        run: |

          if npm run | grep -q "format:check"
          then

            npm run format:check

          elif npm run | grep -q "prettier"
          then

            npm run prettier -- --check .

          else

            echo "No root formatting script detected."

          fi

      ##########################################################################
      # Backend type validation
      ##########################################################################

      - name: Backend Type Validation

        working-directory: ${{ env.BACKEND_DIR }}

        run: |

          if npm run | grep -q "typecheck"
          then

            npm run typecheck

          elif npm run | grep -q "tsc"
          then

            npx tsc --noEmit

          else

            echo "Backend TypeScript validation not configured."

          fi

      ##########################################################################
      # Frontend type validation
      ##########################################################################

      - name: Frontend Type Validation

        working-directory: ${{ env.FRONTEND_DIR }}

        run: |

          if npm run | grep -q "typecheck"
          then

            npm run typecheck

          elif npm run | grep -q "tsc"
          then

            npx tsc --noEmit

          else

            echo "Frontend TypeScript validation not configured."

          fi

      ##########################################################################
      # Metadata
      ##########################################################################

      - name: Generate Build Metadata

        run: |

          mkdir -p reports

          cat > reports/build-metadata.json <<EOF
          {
            "workflow": "${{ github.workflow }}",
            "repository": "${{ github.repository }}",
            "event": "${{ github.event_name }}",
            "ref": "${{ github.ref }}",
            "refName": "${{ github.ref_name }}",
            "commit": "${{ github.sha }}",
            "actor": "${{ github.actor }}",
            "runId": "${{ github.run_id }}",
            "runNumber": "${{ github.run_number }}",
            "node": "${{ env.NODE_VERSION }}",
            "backendDirectory": "${{ env.BACKEND_DIR }}",
            "frontendDirectory": "${{ env.FRONTEND_DIR }}"
          }
          EOF

      ##########################################################################
      # Upload quality artifacts
      ##########################################################################

      - name: Upload Quality Artifacts

        if: ${{ always() }}

        uses: actions/upload-artifact@v4

        with:

          name: quality-stage-artifacts

          path: reports/**

          if-no-files-found: ignore

          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

      ##########################################################################
      # Summary
      ##########################################################################

      - name: Publish Quality Summary

        if: ${{ always() }}

        run: |

          {
            echo "# Quality Stage"
            echo ""
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Repository Structure | verified |"
            echo "| Root Dependencies | installed |"
            echo "| Backend Dependencies | installed |"
            echo "| Frontend Dependencies | installed |"
            echo "| Backend Lint | executed |"
            echo "| Frontend Lint | executed |"
            echo "| Formatting | executed / not configured |"
            echo "| Type Validation | executed / not configured |"
            echo "| Metadata | generated |"
            echo ""
            echo "Node: ${NODE_VERSION}"
            echo "Commit: ${GITHUB_SHA}"
          } >> "$GITHUB_STEP_SUMMARY"

  ##############################################################################
  # 02. BACKEND TESTS
  ##############################################################################

  backend-tests:

    name: Backend Tests

    needs: quality

    runs-on: ubuntu-latest

    timeout-minutes: 40

    strategy:

      fail-fast: false

      matrix:

        node-version:
          - "24.15.0"

    services:

      ##########################################################################
      # MongoDB
      ##########################################################################

      mongodb:

        image: mongo:7.0

        ports:
          - 27017:27017

        options: >-
          --health-cmd="mongosh --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15

      ##########################################################################
      # Redis
      ##########################################################################

      redis:

        image: redis:7-alpine

        ports:
          - 6379:6379

        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15

    env:

      NODE_ENV: test

      PORT: 5000

      MONGODB_URI: mongodb://127.0.0.1:27017/community_savings_test

      REDIS_URL: redis://127.0.0.1:6379

      JWT_SECRET: test-jwt-secret

      JWT_REFRESH_SECRET: test-refresh-secret

      SESSION_SECRET: test-session-secret

      LOG_LEVEL: error

      CI: true

    steps:

      - name: Checkout Repository

        uses: actions/checkout@v4

      - name: Setup Node.js

        uses: actions/setup-node@v4

        with:

          node-version: ${{ matrix.node-version }}

          cache: npm

          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Restore Backend npm Cache

        uses: actions/cache@v4

        with:

          path: ~/.npm

          key: >
            backend-
            ${{ runner.os }}-
            node-${{ matrix.node-version }}-
            ${{ hashFiles('backend/package-lock.json') }}

          restore-keys: |
            backend-${{ runner.os }}-node-${{ matrix.node-version }}-

      - name: Install Backend Dependencies

        working-directory: ${{ env.BACKEND_DIR }}

        run: npm ci

      ##########################################################################
      # MongoDB readiness
      ##########################################################################

      - name: Wait for MongoDB

        run: |

          echo "Waiting for MongoDB..."

          for i in {1..60}
          do

            if mongosh \
              "${MONGODB_URI}" \
              --eval "db.adminCommand({ ping: 1 })" \
              >/dev/null 2>&1
            then

              echo "MongoDB ready."

              exit 0

            fi

            sleep 2

          done

          echo "ERROR: MongoDB did not become ready."

          exit 1

      ##########################################################################
      # Redis readiness
      ##########################################################################

      - name: Wait for Redis

        run: |

          echo "Waiting for Redis..."

          for i in {1..60}
          do

            if redis-cli \
              -u "${REDIS_URL}" \
              ping | grep -q PONG
            then

              echo "Redis ready."

              exit 0

            fi

            sleep 2

          done

          echo "ERROR: Redis did not become ready."

          exit 1

      ##########################################################################
      # Migration contract
      ##########################################################################

      - name: Validate Migration Script

        working-directory: ${{ env.BACKEND_DIR }}

        run: |

          node <<'NODE'
          const pkg = require("./package.json");

          if (!pkg.scripts?.migrate) {
            console.error(
              "ERROR: backend/package.json must define a migrate script."
            );

            process.exit(1);
          }
          NODE

      ##########################################################################
      # Database migration
      ##########################################################################

      - name: Run Database Migrations

        working-directory: ${{ env.BACKEND_DIR }}

        run: npm run migrate

      ##########################################################################
      # Test seed
      ##########################################################################

      - name: Seed Test Database

        working-directory: ${{ env.BACKEND_DIR }}

        run: |

          if npm run | grep -q "seed:test"
          then

            npm run seed:test

          else

            echo "No seed:test script configured; continuing."

          fi

      ##########################################################################
      # Canonical backend CI suite
      #
      # The package.json controls whether the implementation uses:
      #   - Node test runner
      #   - Vitest
      #   - Jest
      #   - integration harnesses
      #
      # The GitHub workflow intentionally does not hard-code framework flags.
      ##########################################################################

      - name: Validate Backend CI Test Contract

        working-directory: ${{ env.BACKEND_DIR }}

        run: |

          node <<'NODE'
          const pkg = require("./package.json");

          if (!pkg.scripts?.["test:ci"]) {
            console.error(
              "ERROR: backend/package.json must define test:ci."
            );

            process.exit(1);
          }
          NODE

      - name: Run Backend CI Test Suite

        working-directory: ${{ env.BACKEND_DIR }}

        run: npm run test:ci

      ##########################################################################
      # Coverage gate
      ##########################################################################

      - name: Verify Backend Coverage

        working-directory: ${{ env.BACKEND_DIR }}

        run: |

          if test ! -f coverage/coverage-summary.json
          then

            echo "ERROR: coverage/coverage-summary.json not found."

            exit 1

          fi

          node <<'NODE'
          const fs = require("fs");

          const file = "coverage/coverage-summary.json";

          const threshold = Number(
            process.env.COVERAGE_THRESHOLD || 85
          );

          const data = JSON.parse(
            fs.readFileSync(file, "utf8")
          );

          const total = data.total;

          const metrics = [
            ["lines", total.lines?.pct],
            ["statements", total.statements?.pct],
            ["functions", total.functions?.pct],
            ["branches", total.branches?.pct]
          ];

          for (const [name, value] of metrics) {

            const numeric = Number(value);

            console.log(`${name}: ${numeric}%`);

            if (!Number.isFinite(numeric)) {

              console.error(
                `Invalid coverage value for ${name}.`
              );

              process.exit(1);

            }

            if (numeric < threshold) {

              console.error(
                `Coverage gate failed: ${name}=${numeric}% < ${threshold}%`
              );

              process.exit(1);

            }

          }

          console.log(
            `Backend coverage gate passed at >= ${threshold}%`
          );
          NODE

      ##########################################################################
      # Upload coverage
      ##########################################################################

      - name: Upload Backend Coverage

        if: ${{ always() }}

        uses: actions/upload-artifact@v4

        with:

          name: backend-coverage

          path: backend/coverage

          if-no-files-found: ignore

          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

      - name: Upload Backend Test Results

        if: ${{ always() }}

        uses: actions/upload-artifact@v4

        with:

          name: backend-test-results

          path: |
            backend/test-results
            backend/junit.xml

          if-no-files-found: ignore

          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

      - name: Upload Backend Coverage to Codecov

        if: ${{ always() }}

        uses: codecov/codecov-action@v4

        with:

          fail_ci_if_error: false

          flags: backend

          directory: backend/coverage

          verbose: true

      - name: Backend Test Summary

        if: ${{ always() }}

        run: |

          {
            echo "# Backend Test Stage"
            echo ""
            echo "| Component | Result |"
            echo "|---|---|"
            echo "| MongoDB | verified |"
            echo "| Redis | verified |"
            echo "| Database Migration | executed |"
            echo "| Test Seed | executed / optional |"
            echo "| Backend CI Suite | ${{ job.status }} |"
            echo "| Coverage | ${COVERAGE_THRESHOLD}% gate |"
          } >> "$GITHUB_STEP_SUMMARY"

  ##############################################################################
  # 03. FRONTEND TESTS
  ##############################################################################

  frontend-tests:

    name: Frontend Tests

    needs: quality

    runs-on: ubuntu-latest

    timeout-minutes: 40

    strategy:

      fail-fast: false

      matrix:

        node-version:
          - "24.15.0"

    env:

      CI: true

      NODE_ENV: test

      VITE_API_URL: http://127.0.0.1:5000

      VITE_ENABLE_MSW: true

      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 0

    steps:

      - name: Checkout Repository

        uses: actions/checkout@v4

      - name: Setup Node.js

        uses: actions/setup-node@v4

        with:

          node-version: ${{ matrix.node-version }}

          cache: npm

          cache-dependency-path: frontend/package-lock.json

      - name: Restore Frontend npm Cache

        uses: actions/cache@v4

        with:

          path: ~/.npm

          key: >
            frontend-
            ${{ runner.os }}-
            node-${{ matrix.node-version }}-
            ${{ hashFiles('frontend/package-lock.json') }}

          restore-keys: |
            frontend-${{ runner.os }}-node-${{ matrix.node-version }}-

      - name: Install Frontend Dependencies

        working-directory: ${{ env.FRONTEND_DIR }}

        run: npm ci

      ##########################################################################
      # Build
      ##########################################################################

      - name: Validate Frontend Build

        working-directory: ${{ env.FRONTEND_DIR }}

        run: npm run build

      ##########################################################################
      # MSW
      ##########################################################################

      - name: Verify MSW Configuration

        working-directory: ${{ env.FRONTEND_DIR }}

        run: |

          if test -f src/testServer.js ||
             test -f src/mocks/browser.js ||
             test -d src/mocks
          then

            echo "MSW configuration detected."

          else

            echo "MSW configuration not detected."

          fi

      ##########################################################################
      # Vitest / frontend tests
      ##########################################################################

      - name: Validate Frontend Test Contract

        working-directory: ${{ env.FRONTEND_DIR }}

        run: |

          node <<'NODE'
          const pkg = require("./package.json");

          if (!pkg.scripts?.test) {
            console.error(
              "ERROR: frontend/package.json must define a test script."
            );

            process.exit(1);
          }
          NODE

      - name: Run Frontend Tests

        working-directory: ${{ env.FRONTEND_DIR }}

        run: |

          npm run test -- \
            --run \
            --coverage

      ##########################################################################
      # Coverage
      ##########################################################################

      - name: Verify Frontend Coverage

        working-directory: ${{ env.FRONTEND_DIR }}

        run: |

          if test ! -f coverage/coverage-summary.json
          then

            echo "ERROR: frontend coverage report missing."

            exit 1

          fi

          node <<'NODE'
          const fs = require("fs");

          const file = "coverage/coverage-summary.json";

          const threshold = Number(
            process.env.COVERAGE_THRESHOLD || 85
          );

          const data = JSON.parse(
            fs.readFileSync(file, "utf8")
          );

          const total = data.total;

          const metrics = [
            ["lines", total.lines?.pct],
            ["statements", total.statements?.pct],
            ["functions", total.functions?.pct],
            ["branches", total.branches?.pct]
          ];

          for (const [name, value] of metrics) {

            const numeric = Number(value);

            console.log(`${name}: ${numeric}%`);

            if (!Number.isFinite(numeric)) {
              console.error(`Invalid ${name} coverage.`);
              process.exit(1);
            }

            if (numeric < threshold) {
              console.error(
                `Coverage gate failed: ${name}=${numeric}% < ${threshold}%`
              );

              process.exit(1);
            }
          }

          console.log(
            `Frontend coverage gate passed at >= ${threshold}%`
          );
          NODE

      ##########################################################################
      # Playwright
      ##########################################################################

      - name: Install Playwright Browsers

        working-directory: ${{ env.FRONTEND_DIR }}

        run: |

          if npm ls @playwright/test >/dev/null 2>&1
          then

            npx playwright install --with-deps

          else

            echo "Playwright dependency not configured."

          fi

      - name: Run Playwright E2E

        working-directory: ${{ env.FRONTEND_DIR }}

        run: |

          if npm run | grep -q "test:e2e"
          then

            npm run test:e2e

          elif test -f playwright.config.js ||
               test -f playwright.config.ts
          then

            npx playwright test

          else

            echo "No Playwright suite configured."

          fi

      ##########################################################################
      # Artifacts
      ##########################################################################

      - name: Upload Frontend Coverage

        if: ${{ always() }}

        uses: actions/upload-artifact@v4

        with:

          name: frontend-coverage

          path: frontend/coverage

          if-no-files-found: ignore

          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

      - name: Upload Playwright Results

        if: ${{ always() }}

        uses: actions/upload-artifact@v4

        with:

          name: playwright-report

          path: |
            frontend/playwright-report
            frontend/test-results

          if-no-files-found: ignore

          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

      - name: Frontend Test Summary

        if: ${{ always() }}

        run: |

          {
            echo "# Frontend Test Stage"
            echo ""
            echo "| Component | Result |"
            echo "|---|---|"
            echo "| React Build | executed |"
            echo "| Frontend Tests | ${{ job.status }} |"
            echo "| MSW | checked |"
            echo "| Playwright | executed / optional |"
            echo "| Coverage | ${COVERAGE_THRESHOLD}% gate |"
          } >> "$GITHUB_STEP_SUMMARY"

  ##############################################################################
  # 04. SECURITY
  ##############################################################################

  security:

    name: Security Scanning

    needs:

      - quality
      - backend-tests
      - frontend-tests

    runs-on: ubuntu-latest

    timeout-minutes: 45

    permissions:

      contents: read

      security-events: write

      pull-requests: write

    env:

      CI: true

      NODE_ENV: production

    steps:

      - name: Checkout Repository

        uses: actions/checkout@v4

        with:

          fetch-depth: 0

      - name: Setup Node.js

        uses: actions/setup-node@v4

        with:

          node-version: ${{ env.NODE_VERSION }}

          cache: npm

          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install Root Dependencies

        run: npm ci

      - name: Install Backend Dependencies

        working-directory: ${{ env.BACKEND_DIR }}

        run: npm ci

      - name: Install Frontend Dependencies

        working-directory: ${{ env.FRONTEND_DIR }}

        run: npm ci

      ##########################################################################
      # npm audit
      #
      # HIGH/CRITICAL vulnerabilities block the pipeline.
      ##########################################################################

      - name: Root npm Audit

        run: npm audit --audit-level=high

      - name: Backend npm Audit

        working-directory: ${{ env.BACKEND_DIR }}

        run: npm audit --audit-level=high

      - name: Frontend npm Audit

        working-directory: ${{ env.FRONTEND_DIR }}

        run: npm audit --audit-level=high

      ##########################################################################
      # Dependency review
      ##########################################################################

      - name: Dependency Review

        if: ${{ github.event_name == 'pull_request' }}

        uses: actions/dependency-review-action@v4

      ##########################################################################
      # CodeQL
      ##########################################################################

      - name: Initialize CodeQL

        uses: github/codeql-action/init@v3

        with:

          languages: javascript

      - name: CodeQL Autobuild

        uses: github/codeql-action/autobuild@v3

      - name: CodeQL Analysis

        uses: github/codeql-action/analyze@v3

      ##########################################################################
      # Trivy
      ##########################################################################

      - name: Trivy High/Critical Filesystem Scan

        uses: aquasecurity/trivy-action@0.24.0

        with:

          scan-type: fs

          scan-ref: .

          format: table

          exit-code: "1"

          ignore-unfixed: true

          severity: HIGH,CRITICAL

      - name: Generate Trivy SARIF

        if: ${{ always() }}

        uses: aquasecurity/trivy-action@0.24.0

        with:

          scan-type: fs

          scan-ref: .

          format: sarif

          output: trivy-results.sarif

          severity: HIGH,CRITICAL

          exit-code: "0"

      - name: Upload Trivy SARIF

        if: ${{ always() }}

        uses: github/codeql-action/upload-sarif@v3

        with:

          sarif_file: trivy-results.sarif

      ##########################################################################
      # Gitleaks
      ##########################################################################

      - name: Gitleaks Secret Scan

        uses: gitleaks/gitleaks-action@v2

      ##########################################################################
      # SBOM
      ##########################################################################

      - name: Generate Node SBOM

        uses: CycloneDX/gh-node-module-generatebom@v1

        with:

          path: .

      - name: Upload SBOM

        if: ${{ always() }}

        uses: actions/upload-artifact@v4

        with:

          name: cyclone-sbom

          path: |
            **/bom.xml
            **/bom.json

          if-no-files-found: ignore

          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

      - name: Upload Trivy Report

        if: ${{ always() }}

        uses: actions/upload-artifact@v4

        with:

          name: trivy-security-report

          path: trivy-results.sarif

          if-no-files-found: ignore

          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

      - name: Security Summary

        if: ${{ always() }}

        run: |

          {
            echo "# Security Stage"
            echo ""
            echo "| Control | Policy |"
            echo "|---|---|"
            echo "| npm audit | BLOCKING at HIGH |"
            echo "| Dependency Review | PR enabled |"
            echo "| CodeQL | BLOCKING |"
            echo "| Trivy | BLOCKING at HIGH/CRITICAL |"
            echo "| Gitleaks | BLOCKING |"
            echo "| SBOM | Generated |"
          } >> "$GITHUB_STEP_SUMMARY"

  ##############################################################################
  # 05. BUILD + PUBLISH CONTAINERS
  #
  # Important:
  #
  # The images are built here and published here.
  #
  # We do NOT:
  #
  #   build → throw away image → rebuild → publish
  #
  # This produces a single build artifact lineage.
  #
  # PR:
  #   images are validated but not pushed.
  #
  # push/tag/manual:
  #   images are pushed to GHCR.
  ##############################################################################

  build-and-publish:

    name: Build • Package • Publish Containers

    needs: security

    runs-on: ubuntu-latest

    timeout-minutes: 60

    permissions:

      contents: read

      packages: write

      id-token: write

      attestations: write

    steps:

      - name: Checkout Repository

        uses: actions/checkout@v4

        with:

          fetch-depth: 0

      - name: Setup Node.js

        uses: actions/setup-node@v4

        with:

          node-version: ${{ env.NODE_VERSION }}

          cache: npm

          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install Backend Dependencies

        working-directory: ${{ env.BACKEND_DIR }}

        run: npm ci

      - name: Install Frontend Dependencies

        working-directory: ${{ env.FRONTEND_DIR }}

        run: npm ci

      ##########################################################################
      # Application builds
      ##########################################################################

      - name: Build Backend

        working-directory: ${{ env.BACKEND_DIR }}

        run: |

          if npm run | grep -q "build"
          then

            npm run build

          else

            echo "Backend build script not configured."

          fi

      - name: Build Frontend

        working-directory: ${{ env.FRONTEND_DIR }}

        run: npm run build

      ##########################################################################
      # Package artifacts
      ##########################################################################

      - name: Package Backend Artifact

        run: |

          tar \
            --exclude=node_modules \
            --exclude=.git \
            --exclude=.env \
            --exclude=.env.* \
            --exclude=coverage \
            --exclude=test-results \
            --exclude=logs \
            --exclude=tmp \
            -czf backend-build.tar.gz \
            backend

      - name: Package Frontend Artifact

        run: |

          tar \
            --exclude=node_modules \
            --exclude=.git \
            -czf frontend-build.tar.gz \
            frontend/dist

      - name: Upload Backend Artifact

        uses: actions/upload-artifact@v4

        with:

          name: backend-build

          path: backend-build.tar.gz

          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

      - name: Upload Frontend Artifact

        uses: actions/upload-artifact@v4

        with:

          name: frontend-build

          path: frontend-build.tar.gz

          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

      ##########################################################################
      # Docker
      ##########################################################################

      - name: Setup Docker Buildx

        uses: docker/setup-buildx-action@v3

      - name: Enable Multi-Architecture

        uses: docker/setup-qemu-action@v3

      ##########################################################################
      # GHCR authentication
      ##########################################################################

      - name: Login to GHCR

        if: >
          github.event_name == 'push' ||
          github.event_name == 'workflow_dispatch'

        uses: docker/login-action@v3

        with:

          registry: ${{ env.REGISTRY }}

          username: ${{ github.actor }}

          password: ${{ secrets.GITHUB_TOKEN }}

      ##########################################################################
      # Backend metadata
      ##########################################################################

      - name: Backend Docker Metadata

        id: backend-meta

        uses: docker/metadata-action@v5

        with:

          images: >
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.BACKEND_IMAGE }}

          tags: |
            type=sha
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

          labels: |
            org.opencontainers.image.title=TITech Community Capital Backend
            org.opencontainers.image.vendor=TITech Community Capital LTD
            org.opencontainers.image.source=${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      ##########################################################################
      # Frontend metadata
      ##########################################################################

      - name: Frontend Docker Metadata

        id: frontend-meta

        uses: docker/metadata-action@v5

        with:

          images: >
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.FRONTEND_IMAGE }}

          tags: |
            type=sha
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

          labels: |
            org.opencontainers.image.title=TITech Community Capital Frontend
            org.opencontainers.image.vendor=TITech Community Capital LTD
            org.opencontainers.image.source=${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      ##########################################################################
      # Backend image
      ##########################################################################

      - name: Build Backend Container

        id: backend-image

        uses: docker/build-push-action@v6

        with:

          context: ./backend

          push: >
            ${{ github.event_name == 'push' ||
                github.event_name == 'workflow_dispatch' }}

          platforms: |
            linux/amd64
            linux/arm64

          provenance: mode=max

          sbom: true

          tags: ${{ steps.backend-meta.outputs.tags }}

          labels: ${{ steps.backend-meta.outputs.labels }}

          cache-from: type=gha

          cache-to: type=gha,mode=max

      ##########################################################################
      # Frontend image
      ##########################################################################

      - name: Build Frontend Container

        id: frontend-image

        uses: docker/build-push-action@v6

        with:

          context: ./frontend

          push: >
            ${{ github.event_name == 'push' ||
                github.event_name == 'workflow_dispatch' }}

          platforms: |
            linux/amd64
            linux/arm64

          provenance: mode=max

          sbom: true

          tags: ${{ steps.frontend-meta.outputs.tags }}

          labels: ${{ steps.frontend-meta.outputs.labels }}

          cache-from: type=gha

          cache-to: type=gha,mode=max

      ##########################################################################
      # Cosign
      ##########################################################################

      - name: Install Cosign

        if: >
          github.event_name == 'push' ||
          github.event_name == 'workflow_dispatch'

        uses: sigstore/cosign-installer@v3

      - name: Verify Cosign

        if: >
          github.event_name == 'push' ||
          github.event_name == 'workflow_dispatch'

        run: cosign version

      - name: Sign Backend Image

        if: >
          github.event_name == 'push' ||
          github.event_name == 'workflow_dispatch'

        env:

          COSIGN_EXPERIMENTAL: "true"

        run: |

          cosign sign --yes \
            "${REGISTRY}/${IMAGE_NAMESPACE}/${BACKEND_IMAGE}@${{ steps.backend-image.outputs.digest }}"

      - name: Sign Frontend Image

        if: >
          github.event_name == 'push' ||
          github.event_name == 'workflow_dispatch'

        env:

          COSIGN_EXPERIMENTAL: "true"

        run: |

          cosign sign --yes \
            "${REGISTRY}/${IMAGE_NAMESPACE}/${FRONTEND_IMAGE}@${{ steps.frontend-image.outputs.digest }}"

      ##########################################################################
      # Provenance attestations
      ##########################################################################

      - name: Attest Backend Build

        if: >
          github.event_name == 'push' ||
          github.event_name == 'workflow_dispatch'

        uses: actions/attest-build-provenance@v2

        with:

          subject-name: >
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.BACKEND_IMAGE }}

          subject-digest: ${{ steps.backend-image.outputs.digest }}

          push-to-registry: true

      - name: Attest Frontend Build

        if: >
          github.event_name == 'push' ||
          github.event_name == 'workflow_dispatch'

        uses: actions/attest-build-provenance@v2

        with:

          subject-name: >
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.FRONTEND_IMAGE }}

          subject-digest: ${{ steps.frontend-image.outputs.digest }}

          push-to-registry: true

      ##########################################################################
      # Record digests
      ##########################################################################

      - name: Generate Image Manifest

        run: |

          mkdir -p reports

          cat > reports/container-manifest.json <<EOF
          {
            "repository": "${{ github.repository }}",
            "commit": "${{ github.sha }}",
            "backend": {
              "image": "${REGISTRY}/${IMAGE_NAMESPACE}/${BACKEND_IMAGE}",
              "digest": "${{ steps.backend-image.outputs.digest }}"
            },
            "frontend": {
              "image": "${REGISTRY}/${IMAGE_NAMESPACE}/${FRONTEND_IMAGE}",
              "digest": "${{ steps.frontend-image.outputs.digest }}"
            }
          }
          EOF

      - name: Upload Container Manifest

        uses: actions/upload-artifact@v4

        with:

          name: container-manifest

          path: reports/container-manifest.json

          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

      - name: Build Summary

        if: ${{ always() }}

        run: |

          {
            echo "# Build & Container Stage"
            echo ""
            echo "| Component | Result |"
            echo "|---|---|"
            echo "| Backend Build Context | backend/ |"
            echo "| Frontend Build Context | frontend/ |"
            echo "| Backend Image | built |"
            echo "| Frontend Image | built |"
            echo "| Multi-Architecture | amd64 + arm64 |"
            echo "| SBOM | enabled |"
            echo "| Provenance | enabled for pushed images |"
            echo "| Cosign | enabled for pushed images |"
            echo "| Container Manifest | generated |"
            echo "| Commit | ${GITHUB_SHA} |"
          } >> "$GITHUB_STEP_SUMMARY"

  ##############################################################################
  # 06. STAGING DEPLOYMENT
  #
  # Runs only for:
  #
  #   - push events
  #   - manual staging
  #   - manual production
  #
  # Never runs for:
  #
  #   - pull_request
  #   - schedule
  #
  # A manual production request deliberately passes through staging first.
  ##############################################################################

  deploy-staging:

    name: Deploy to Staging

    needs:
      - build-and-publish

    if: >
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch'

    runs-on: ubuntu-latest

    timeout-minutes: 45

    environment:

      name: staging

      url: https://staging.communitycapital.titech.africa

    permissions:

      contents: read

      packages: read

      id-token: write

    env:

      KUBE_NAMESPACE: ${{ env.K8S_NAMESPACE_STAGING }}

      BACKEND_RELEASE: backend

      FRONTEND_RELEASE: frontend

      BACKEND_DEPLOYMENT: community-savings-backend

      FRONTEND_DEPLOYMENT: community-savings-frontend

      DATABASE_MIGRATION_TIMEOUT: 900

    steps:

      - name: Checkout Repository

        uses: actions/checkout@v4

      - name: Setup kubectl

        uses: azure/setup-kubectl@v4

      - name: Setup Helm

        uses: azure/setup-helm@v4

      - name: Configure Kubernetes

        uses: azure/k8s-set-context@v4

        with:

          method: kubeconfig

          kubeconfig: ${{ secrets.KUBE_CONFIG_STAGING }}

      - name: Verify Cluster

        run: |

          kubectl cluster-info

          kubectl get nodes

      - name: Ensure Namespace Exists

        run: |

          kubectl get namespace "${KUBE_NAMESPACE}" >/dev/null 2>&1 ||
            kubectl create namespace "${KUBE_NAMESPACE}"

      ##########################################################################
      # Validate migration contract
      ##########################################################################

      - name: Validate Migration Contract

        working-directory: ${{ env.BACKEND_DIR }}

        run: |

          node <<'NODE'
          const pkg = require("./package.json");

          if (!pkg.scripts?.migrate) {
            console.error(
              "ERROR: backend/package.json must define migrate."
            );

            process.exit(1);
          }
          NODE

      ##########################################################################
      # Staging migration
      ##########################################################################

      - name: Run Staging Database Migration

        working-directory: ${{ env.BACKEND_DIR }}

        env:

          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}

          NODE_ENV: production

        run: |

          timeout \
            "${DATABASE_MIGRATION_TIMEOUT}" \
            npm run migrate

      ##########################################################################
      # Backend deployment
      ##########################################################################
      #
      # --atomic:
      #   If Helm upgrade fails, Helm attempts to restore the previous state.
      #
      ##########################################################################

      - name: Deploy Backend

        run: |

          helm upgrade \
            --install \
            "${BACKEND_RELEASE}" \
            ./deployment/charts/backend \
            --namespace "${KUBE_NAMESPACE}" \
            --create-namespace \
            --set image.repository="${REGISTRY}/${IMAGE_NAMESPACE}/${BACKEND_IMAGE}" \
            --set image.tag="${IMAGE_TAG}" \
            --wait \
            --atomic \
            --timeout=15m

      ##########################################################################
      # Frontend deployment
      ##########################################################################

      - name: Deploy Frontend

        run: |

          helm upgrade \
            --install \
            "${FRONTEND_RELEASE}" \
            ./deployment/charts/frontend \
            --namespace "${KUBE_NAMESPACE}" \
            --create-namespace \
            --set image.repository="${REGISTRY}/${IMAGE_NAMESPACE}/${FRONTEND_IMAGE}" \
            --set image.tag="${IMAGE_TAG}" \
            --wait \
            --atomic \
            --timeout=15m

      ##########################################################################
      # Rollouts
      ##########################################################################

      - name: Verify Backend Rollout

        run: |

          kubectl rollout status \
            "deployment/${BACKEND_DEPLOYMENT}" \
            -n "${KUBE_NAMESPACE}" \
            --timeout=10m

      - name: Verify Frontend Rollout

        run: |

          kubectl rollout status \
            "deployment/${FRONTEND_DEPLOYMENT}" \
            -n "${KUBE_NAMESPACE}" \
            --timeout=10m

      ##########################################################################
      # Workload diagnostics
      ##########################################################################

      - name: Verify Staging Workloads

        run: |

          kubectl get deployments \
            -n "${KUBE_NAMESPACE}"

          kubectl get pods \
            -n "${KUBE_NAMESPACE}" \
            -o wide

          kubectl get services \
            -n "${KUBE_NAMESPACE}"

      ##########################################################################
      # Staging API health
      ##########################################################################

      - name: Verify Staging API

        run: |

          for i in {1..30}
          do

            if curl \
              --fail \
              --silent \
              --show-error \
              --max-time 15 \
              https://staging-api.communitycapital.titech.africa/health
            then

              echo "Staging API healthy."

              exit 0

            fi

            sleep 10

          done

          echo "ERROR: Staging API health check failed."

          exit 1

      ##########################################################################
      # Diagnostics
      ##########################################################################

      - name: Collect Staging Diagnostics

        if: ${{ failure() }}

        run: |

          kubectl get deployments \
            -n "${KUBE_NAMESPACE}" || true

          kubectl get pods \
            -n "${KUBE_NAMESPACE}" \
            -o wide || true

          kubectl get events \
            -n "${KUBE_NAMESPACE}" \
            --sort-by=.lastTimestamp || true

      - name: Staging Summary

        if: ${{ always() }}

        run: |

          {
            echo "# Staging Deployment"
            echo ""
            echo "| Item | Result |"
            echo "|---|---|"
            echo "| Namespace | ${KUBE_NAMESPACE} |"
            echo "| Backend | deployed |"
            echo "| Frontend | deployed |"
            echo "| Database Migration | executed |"
            echo "| Helm Atomic Rollback | enabled |"
            echo "| Backend Rollout | verified |"
            echo "| Frontend Rollout | verified |"
            echo "| API Health | verified |"
            echo "| Commit | ${GITHUB_SHA} |"
          } >> "$GITHUB_STEP_SUMMARY"

  ##############################################################################
  # 07. PRODUCTION DEPLOYMENT
  #
  # HARD GATE:
  #
  # Production is reachable only from:
  #
  #   A. version tag: v*
  #
  # OR
  #
  #   B. explicit workflow_dispatch environment=production
  #
  # Ordinary pushes, PRs and scheduled executions cannot deploy production.
  #
  ##############################################################################

  deploy-production:

    name: Production Deployment

    needs:
      - deploy-staging

    if: >
      (
        github.event_name == 'push' &&
        startsWith(github.ref, 'refs/tags/v')
      )
      ||
      (
        github.event_name == 'workflow_dispatch' &&
        inputs.environment == 'production'
      )

    runs-on: ubuntu-latest

    timeout-minutes: 60

    environment:

      name: production

      url: https://communitycapital.titech.africa

    concurrency:

      group: titech-production-deployment

      cancel-in-progress: false

    permissions:

      contents: write

      deployments: write

      packages: read

      id-token: write

    env:

      KUBE_NAMESPACE: ${{ env.K8S_NAMESPACE_PRODUCTION }}

      BACKEND_RELEASE: backend

      FRONTEND_RELEASE: frontend

      BACKEND_DEPLOYMENT: community-savings-backend

      FRONTEND_DEPLOYMENT: community-savings-frontend

      DATABASE_MIGRATION_TIMEOUT: 900

    steps:

      - name: Checkout Repository

        uses: actions/checkout@v4

      - name: Setup kubectl

        uses: azure/setup-kubectl@v4

      - name: Setup Helm

        uses: azure/setup-helm@v4

      - name: Configure Kubernetes

        uses: azure/k8s-set-context@v4

        with:

          method: kubeconfig

          kubeconfig: ${{ secrets.KUBE_CONFIG_PRODUCTION }}

      - name: Verify Production Cluster

        run: |

          kubectl cluster-info

          kubectl get nodes

      - name: Ensure Production Namespace Exists

        run: |

          kubectl get namespace "${KUBE_NAMESPACE}" >/dev/null 2>&1 ||
            kubectl create namespace "${KUBE_NAMESPACE}"

      ##########################################################################
      # Migration contract
      ##########################################################################

      - name: Validate Production Migration Contract

        working-directory: ${{ env.BACKEND_DIR }}

        run: |

          node <<'NODE'
          const pkg = require("./package.json");

          if (!pkg.scripts?.migrate) {
            console.error(
              "ERROR: production migration script is missing."
            );

            process.exit(1);
          }
          NODE

      ##########################################################################
      # Production migration
      ##########################################################################

      - name: Execute Production Database Migration

        working-directory: ${{ env.BACKEND_DIR }}

        env:

          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}

          NODE_ENV: production

        run: |

          timeout \
            "${DATABASE_MIGRATION_TIMEOUT}" \
            npm run migrate

      ##########################################################################
      # Backend
      ##########################################################################

      - name: Deploy Backend

        run: |

          helm upgrade \
            --install \
            "${BACKEND_RELEASE}" \
            ./deployment/charts/backend \
            --namespace "${KUBE_NAMESPACE}" \
            --create-namespace \
            --set image.repository="${REGISTRY}/${IMAGE_NAMESPACE}/${BACKEND_IMAGE}" \
            --set image.tag="${IMAGE_TAG}" \
            --set deployment.strategy=RollingUpdate \
            --set deployment.maxUnavailable=0 \
            --set deployment.maxSurge=1 \
            --wait \
            --atomic \
            --timeout=20m

      ##########################################################################
      # Frontend
      ##########################################################################

      - name: Deploy Frontend

        run: |

          helm upgrade \
            --install \
            "${FRONTEND_RELEASE}" \
            ./deployment/charts/frontend \
            --namespace "${KUBE_NAMESPACE}" \
            --create-namespace \
            --set image.repository="${REGISTRY}/${IMAGE_NAMESPACE}/${FRONTEND_IMAGE}" \
            --set image.tag="${IMAGE_TAG}" \
            --set deployment.strategy=RollingUpdate \
            --set deployment.maxUnavailable=0 \
            --set deployment.maxSurge=1 \
            --wait \
            --atomic \
            --timeout=20m

      ##########################################################################
      # Rollout
      ##########################################################################

      - name: Verify Backend Rollout

        run: |

          kubectl rollout status \
            "deployment/${BACKEND_DEPLOYMENT}" \
            -n "${KUBE_NAMESPACE}" \
            --timeout=15m

      - name: Verify Frontend Rollout

        run: |

          kubectl rollout status \
            "deployment/${FRONTEND_DEPLOYMENT}" \
            -n "${KUBE_NAMESPACE}" \
            --timeout=15m

      ##########################################################################
      # Production health
      ##########################################################################

      - name: Production API Health Check

        run: |

          for i in {1..30}
          do

            if curl \
              --fail \
              --silent \
              --show-error \
              --max-time 15 \
              https://api.communitycapital.titech.africa/health
            then

              echo "Production API healthy."

              exit 0

            fi

            sleep 10

          done

          echo "ERROR: Production API health check failed."

          exit 1

      ##########################################################################
      # Production workload verification
      ##########################################################################

      - name: Verify Production Workloads

        run: |

          kubectl get deployments \
            -n "${KUBE_NAMESPACE}"

          kubectl get pods \
            -n "${KUBE_NAMESPACE}" \
            -o wide

          kubectl get services \
            -n "${KUBE_NAMESPACE}"

      ##########################################################################
      # Deployment record
      ##########################################################################

      - name: Create GitHub Deployment Record

        if: ${{ success() }}

        uses: bobheadxi/deployments@v1

        with:

          step: finish

          env: production

          status: success

          env_url: https://communitycapital.titech.africa

      ##########################################################################
      # Versioned release
      ##########################################################################

      - name: Create GitHub Release

        if: >
          success() &&
          github.event_name == 'push' &&
          startsWith(github.ref, 'refs/tags/v')

        uses: softprops/action-gh-release@v2

        with:

          generate_release_notes: true

          tag_name: ${{ github.ref_name }}

          name: TITech Community Capital ${{ github.ref_name }}

          target_commitish: ${{ github.sha }}

      ##########################################################################
      # Failure diagnostics
      ##########################################################################

      - name: Collect Production Diagnostics

        if: ${{ failure() }}

        run: |

          kubectl get deployments \
            -n "${KUBE_NAMESPACE}" || true

          kubectl get pods \
            -n "${KUBE_NAMESPACE}" \
            -o wide || true

          kubectl get services \
            -n "${KUBE_NAMESPACE}" || true

          kubectl get events \
            -n "${KUBE_NAMESPACE}" \
            --sort-by=.lastTimestamp || true

      - name: Production Summary

        if: ${{ always() }}

        run: |

          {
            echo "# Production Deployment"
            echo ""
            echo "| Item | Result |"
            echo "|---|---|"
            echo "| Protected Environment | enabled |"
            echo "| Namespace | ${KUBE_NAMESPACE} |"
            echo "| Backend | rolling deployment |"
            echo "| Frontend | rolling deployment |"
            echo "| maxUnavailable | 0 |"
            echo "| maxSurge | 1 |"
            echo "| Database Migration | executed |"
            echo "| Helm Atomic Rollback | enabled |"
            echo "| Backend Rollout | verified |"
            echo "| Frontend Rollout | verified |"
            echo "| API Health | verified |"
            echo "| Commit | ${GITHUB_SHA} |"
            echo "| Run | ${GITHUB_RUN_NUMBER} |"
          } >> "$GITHUB_STEP_SUMMARY"

  ##############################################################################
  # 08. POST-DEPLOYMENT VERIFICATION
  ##############################################################################

  post-deployment:

    name: Post Deployment Verification

    needs:
      - deploy-production

    if: >
      needs.deploy-production.result == 'success'

    runs-on: ubuntu-latest

    timeout-minutes: 30

    permissions:

      contents: read

      deployments: read

    env:

      API_URL: https://api.communitycapital.titech.africa

      WEB_URL: https://communitycapital.titech.africa

      KUBE_NAMESPACE: ${{ env.K8S_NAMESPACE_PRODUCTION }}

    steps:

      - name: Checkout Repository

        uses: actions/checkout@v4

      - name: Setup kubectl

        uses: azure/setup-kubectl@v4

      - name: Configure Kubernetes

        uses: azure/k8s-set-context@v4

        with:

          method: kubeconfig

          kubeconfig: ${{ secrets.KUBE_CONFIG_PRODUCTION }}

      ##########################################################################
      # API smoke
      ##########################################################################

      - name: API Smoke Tests

        run: |

          echo "Running production API smoke tests..."

          curl \
            --fail \
            --retry 5 \
            --retry-delay 5 \
            --retry-all-errors \
            --max-time 30 \
            "${API_URL}/health"

          curl \
            --fail \
            --retry 5 \
            --retry-delay 5 \
            --retry-all-errors \
            --max-time 30 \
            "${API_URL}/version"

      ##########################################################################
      # Frontend smoke
      ##########################################################################

      - name: Frontend Smoke Test

        run: |

          curl \
            --fail \
            --retry 5 \
            --retry-delay 5 \
            --retry-all-errors \
            --max-time 30 \
            "${WEB_URL}"

      ##########################################################################
      # Kubernetes
      ##########################################################################

      - name: Verify Kubernetes Health

        run: |

          kubectl get pods \
            -n "${KUBE_NAMESPACE}" \
            -o wide

          kubectl get deployments \
            -n "${KUBE_NAMESPACE}"

          kubectl get services \
            -n "${KUBE_NAMESPACE}"

      ##########################################################################
      # Rollout
      ##########################################################################

      - name: Verify Backend Rollout

        run: |

          kubectl rollout status \
            deployment/community-savings-backend \
            -n "${KUBE_NAMESPACE}" \
            --timeout=10m

      - name: Verify Frontend Rollout

        run: |

          kubectl rollout status \
            deployment/community-savings-frontend \
            -n "${KUBE_NAMESPACE}" \
            --timeout=10m

      ##########################################################################
      # Monitoring
      ##########################################################################

      - name: Verify Prometheus

        run: |

          curl \
            --fail \
            --max-time 15 \
            https://prometheus.communitycapital.titech.africa/-/healthy

      - name: Verify Grafana

        run: |

          curl \
            --fail \
            --max-time 15 \
            https://grafana.communitycapital.titech.africa/api/health

      ##########################################################################
      # Metrics
      ##########################################################################

      - name: Record Deployment Metrics

        run: |

          echo "Deployment Timestamp: $(date -u)"
          echo "Repository: ${{ github.repository }}"
          echo "Commit: ${{ github.sha }}"
          echo "Actor: ${{ github.actor }}"
          echo "Run: ${{ github.run_number }}"
          echo "Ref: ${{ github.ref_name }}"

      ##########################################################################
      # Slack
      ##########################################################################

      - name: Notify Slack

        if: ${{ env.SLACK_WEBHOOK_URL != '' }}

        uses: slackapi/slack-github-action@v1.27.0

        env:

          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

        with:

          payload: |
            {
              "text": "✅ TITech Community Capital production deployment successful.\nRepository: ${{ github.repository }}\nRun: ${{ github.run_number }}\nCommit: ${{ github.sha }}\nEnvironment: Production"
            }

      ##########################################################################
      # Microsoft Teams
      ##########################################################################

      - name: Notify Microsoft Teams

        if: ${{ env.TEAMS_WEBHOOK_URL != '' }}

        uses: skitionek/notify-microsoft-teams@v1

        env:

          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}

        with:

          webhook_url: ${{ env.TEAMS_WEBHOOK_URL }}

          overwrite: |
            {
              "@type": "MessageCard",
              "@context": "https://schema.org/extensions",
              "summary": "TITech Production Deployment",
              "title": "Production Deployment Successful",
              "text": "TITech Community Capital has been deployed successfully."
            }

      ##########################################################################
      # Final summary
      ##########################################################################

      - name: Publish Post Deployment Summary

        if: ${{ always() }}

        run: |

          {
            echo "# Production Post-Deployment"
            echo ""
            echo "| Verification | Result |"
            echo "|---|---|"
            echo "| API Health | verified |"
            echo "| API Version | verified |"
            echo "| Frontend | verified |"
            echo "| Kubernetes | verified |"
            echo "| Backend Rollout | verified |"
            echo "| Frontend Rollout | verified |"
            echo "| Prometheus | verified |"
            echo "| Grafana | verified |"
            echo "| Notifications | attempted |"
            echo ""
            echo "Repository: ${{ github.repository }}"
            echo "Commit: ${{ github.sha }}"
            echo "Run: ${{ github.run_number }}"
            echo "Timestamp: $(date -u) UTC"
          } >> "$GITHUB_STEP_SUMMARY"