################################################################################
# TITech Community Capital LTD
# Enterprise CI Test Pipeline
#
# File:
#   .github/workflows/test.yml
#
# Purpose:
#   Dedicated continuous-integration test pipeline for TITech Community Capital.
#
# Canonical project structure:
#
#   backend/
#   frontend/
#
# Responsibilities:
#
#   - Frontend linting
#   - Frontend type validation
#   - Frontend unit tests
#   - Frontend production build
#   - Backend linting
#   - Backend type validation
#   - Backend unit/integration test execution
#   - MongoDB integration testing
#   - Redis integration testing
#   - Dependency security validation
#   - Coverage verification
#   - CI artifacts
#
# Deployment is NOT performed here.
#
# Deployment ownership:
#
#   .github/workflows/deploy.yml
#
################################################################################

name: TITech Enterprise CI Test Pipeline

################################################################################
# RUN NAME
################################################################################

run-name: >
  CI Tests • ${{ github.ref_name }} •
  ${{ github.actor }} •
  #${{ github.run_number }}

################################################################################
# TRIGGERS
################################################################################

on:

  push:

    branches:
      - main
      - develop
      - release/**
      - feature/**
      - hotfix/**

  pull_request:

    branches:
      - "**"

  workflow_dispatch:

################################################################################
# DEFAULT PERMISSIONS
################################################################################

permissions:

  contents: read

################################################################################
# CONCURRENCY
################################################################################

concurrency:

  group: >
    titech-ci-${{ github.ref }}

  cancel-in-progress: true

################################################################################
# GLOBAL ENVIRONMENT
################################################################################

env:

  ##########################################################################
  # Application
  ##########################################################################

  APP_NAME: titech-community-capital

  COMPANY_NAME: TITech Community Capital LTD

  PRODUCT_NAME: Community Capital

  ##########################################################################
  # Runtime
  ##########################################################################

  NODE_VERSION: "24.15.0"

  NODE_ENV: test

  CI: true

  TZ: UTC

  ##########################################################################
  # Canonical directories
  ##########################################################################

  ROOT_DIR: .

  BACKEND_DIR: backend

  FRONTEND_DIR: frontend

  REPORTS_DIR: reports

  COVERAGE_THRESHOLD: "85"

  ARTIFACT_RETENTION_DAYS: "30"

  ##########################################################################
  # Integration services
  ##########################################################################

  MONGODB_URI: mongodb://127.0.0.1:27017/titech_test

  MONGO_URI: mongodb://127.0.0.1:27017/titech_test

  REDIS_URL: redis://127.0.0.1:6379

################################################################################
# DEFAULTS
################################################################################

defaults:

  run:

    shell: bash

################################################################################
# JOBS
################################################################################

jobs:

  ##############################################################################
  # 01. FRONTEND
  ##############################################################################

  frontend:

    name: Frontend CI • Node ${{ matrix.node }}

    runs-on: ubuntu-latest

    timeout-minutes: 30

    strategy:

      fail-fast: false

      matrix:

        node:
          - "24.15.0"

    env:

      NODE_ENV: test

      CI: true

    steps:

      ##########################################################################
      # Checkout
      ##########################################################################

      - name: Checkout Repository

        uses: actions/checkout@v4

        with:

          fetch-depth: 1

      ##########################################################################
      # Node
      ##########################################################################

      - name: Setup Node.js

        uses: actions/setup-node@v4

        with:

          node-version: ${{ matrix.node }}

          cache: npm

          cache-dependency-path: frontend/package-lock.json

      ##########################################################################
      # Verify canonical structure
      ##########################################################################

      - name: Verify Frontend Structure

        run: |

          set -euo pipefail

          test -d "${FRONTEND_DIR}"

          test -f "${FRONTEND_DIR}/package.json"

          test -f "${FRONTEND_DIR}/package-lock.json"

          echo "Frontend structure verified."

      ##########################################################################
      # Install
      ##########################################################################

      - name: Install Frontend Dependencies

        working-directory: ${{ env.FRONTEND_DIR }}

        run: npm ci

      ##########################################################################
      # Package validation
      ##########################################################################

      - name: Validate Frontend Package

        working-directory: ${{ env.FRONTEND_DIR }}

        run: |

          node <<'NODE'
          const pkg = require("./package.json");

          const required = [
            "build",
            "test"
          ];

          for (const script of required) {

            if (!pkg.scripts?.[script]) {

              console.error(
                `ERROR: frontend/package.json must define "${script}".`
              );

              process.exit(1);
            }
          }

          console.log("Frontend package contract verified.");
          NODE

      ##########################################################################
      # Lint
      ##########################################################################

      - name: Frontend ESLint

        working-directory: ${{ env.FRONTEND_DIR }}

        run: |

          if npm run | grep -q "lint"
          then

            npm run lint

          else

            echo "ERROR: frontend lint script is required."

            exit 1

          fi

      ##########################################################################
      # Type validation
      ##########################################################################

      - name: Frontend Type Check

        working-directory: ${{ env.FRONTEND_DIR }}

        run: |

          if npm run | grep -q "typecheck"
          then

            npm run typecheck

          elif npm run | grep -q "tsc"
          then

            npx tsc --noEmit

          else

            echo "Frontend TypeScript validation not configured."

          fi

      ##########################################################################
      # Unit tests
      ##########################################################################

      - name: Frontend Unit Tests

        working-directory: ${{ env.FRONTEND_DIR }}

        run: |

          npm run test -- \
            --run \
            --coverage

      ##########################################################################
      # Production build
      ##########################################################################

      - name: Build Frontend

        working-directory: ${{ env.FRONTEND_DIR }}

        run: npm run build

      ##########################################################################
      # Coverage gate
      ##########################################################################

      - name: Verify Frontend Coverage

        working-directory: ${{ env.FRONTEND_DIR }}

        run: |

          if test ! -f coverage/coverage-summary.json
          then

            echo "ERROR: frontend coverage report missing."

            exit 1

          fi

          node <<'NODE'
          const fs = require("fs");

          const file = "coverage/coverage-summary.json";

          const threshold =
            Number(process.env.COVERAGE_THRESHOLD || 85);

          const data =
            JSON.parse(fs.readFileSync(file, "utf8"));

          const total = data.total;

          const metrics = [
            ["lines", total.lines?.pct],
            ["statements", total.statements?.pct],
            ["functions", total.functions?.pct],
            ["branches", total.branches?.pct]
          ];

          for (const [name, value] of metrics) {

            const numeric = Number(value);

            if (!Number.isFinite(numeric)) {

              console.error(
                `Invalid ${name} coverage value.`
              );

              process.exit(1);
            }

            console.log(`${name}: ${numeric}%`);

            if (numeric < threshold) {

              console.error(
                `Coverage gate failed: ${name}=${numeric}% < ${threshold}%`
              );

              process.exit(1);
            }
          }

          console.log(
            `Frontend coverage gate passed at >= ${threshold}%`
          );
          NODE

      ##########################################################################
      # Upload coverage
      ##########################################################################

      - name: Upload Frontend Coverage

        if: ${{ always() }}

        uses: actions/upload-artifact@v4

        with:

          name: frontend-coverage-node-${{ matrix.node }}

          path: frontend/coverage

          if-no-files-found: ignore

          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

      ##########################################################################
      # Upload test results
      ##########################################################################

      - name: Upload Frontend Test Results

        if: ${{ always() }}

        uses: actions/upload-artifact@v4

        with:

          name: frontend-test-results-node-${{ matrix.node }}

          path: frontend/test-results

          if-no-files-found: ignore

          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

      ##########################################################################
      # Upload build
      ##########################################################################

      - name: Upload Frontend Build Artifact

        if: ${{ success() }}

        uses: actions/upload-artifact@v4

        with:

          name: frontend-build-node-${{ matrix.node }}

          path: frontend/dist

          if-no-files-found: error

          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

      ##########################################################################
      # Summary
      ##########################################################################

      - name: Frontend Summary

        if: ${{ always() }}

        run: |

          {
            echo "# Frontend CI"
            echo ""
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Node | ${{ matrix.node }} |"
            echo "| Dependencies | installed |"
            echo "| ESLint | executed |"
            echo "| Type Check | executed / not configured |"
            echo "| Unit Tests | executed |"
            echo "| Coverage | ${COVERAGE_THRESHOLD}% gate |"
            echo "| Build | executed |"
            echo "| Artifacts | uploaded |"
          } >> "${GITHUB_STEP_SUMMARY}"

  ##############################################################################
  # 02. BACKEND
  ##############################################################################

  backend:

    name: Backend CI • Node ${{ matrix.node }}

    runs-on: ubuntu-latest

    timeout-minutes: 40

    strategy:

      fail-fast: false

      matrix:

        node:
          - "24.15.0"

    services:

      ##########################################################################
      # MongoDB
      ##########################################################################

      mongodb:

        image: mongo:7

        ports:

          - 27017:27017

        options: >-

          --health-cmd="mongosh --eval 'db.runCommand({ ping: 1 })'"

          --health-interval=10s

          --health-timeout=5s

          --health-retries=15

      ##########################################################################
      # Redis
      ##########################################################################

      redis:

        image: redis:7-alpine

        ports:

          - 6379:6379

        options: >-

          --health-cmd="redis-cli ping"

          --health-interval=10s

          --health-timeout=5s

          --health-retries=15

    env:

      NODE_ENV: test

      PORT: 5001

      JWT_SECRET: titech-ci-test-jwt-secret

      JWT_REFRESH_SECRET: titech-ci-test-refresh-secret

      SESSION_SECRET: titech-ci-test-session-secret

      MONGODB_URI: mongodb://127.0.0.1:27017/titech_test

      MONGO_URI: mongodb://127.0.0.1:27017/titech_test

      REDIS_URL: redis://127.0.0.1:6379

      LOG_LEVEL: error

      CI: true

    steps:

      ##########################################################################
      # Checkout
      ##########################################################################

      - name: Checkout Repository

        uses: actions/checkout@v4

        with:

          fetch-depth: 1

      ##########################################################################
      # Node
      ##########################################################################

      - name: Setup Node.js

        uses: actions/setup-node@v4

        with:

          node-version: ${{ matrix.node }}

          cache: npm

          cache-dependency-path: backend/package-lock.json

      ##########################################################################
      # Verify structure
      ##########################################################################

      - name: Verify Backend Structure

        run: |

          set -euo pipefail

          test -d "${BACKEND_DIR}"

          test -f "${BACKEND_DIR}/package.json"

          test -f "${BACKEND_DIR}/package-lock.json"

          echo "Backend structure verified."

      ##########################################################################
      # Install
      ##########################################################################

      - name: Install Backend Dependencies

        working-directory: ${{ env.BACKEND_DIR }}

        run: npm ci

      ##########################################################################
      # Package validation
      ##########################################################################

      - name: Validate Backend Package

        working-directory: ${{ env.BACKEND_DIR }}

        run: |

          node <<'NODE'
          const pkg = require("./package.json");

          const requiredAny = [
            ["test:ci", "test"]
          ];

          for (const candidates of requiredAny) {

            const found =
              candidates.find(
                script => Boolean(pkg.scripts?.[script])
              );

            if (!found) {

              console.error(
                `ERROR: backend/package.json must define one of: ${candidates.join(", ")}`
              );

              process.exit(1);
            }
          }

          console.log("Backend package contract verified.");
          NODE

      ##########################################################################
      # Wait for MongoDB
      ##########################################################################

      - name: Wait for MongoDB

        run: |

          set -euo pipefail

          echo "Waiting for MongoDB..."

          for i in {1..60}
          do

            if mongosh \
              "${MONGODB_URI}" \
              --eval "db.adminCommand({ ping: 1 })" \
              >/dev/null 2>&1
            then

              echo "MongoDB ready."

              exit 0

            fi

            sleep 2

          done

          echo "ERROR: MongoDB failed to become ready."

          exit 1

      ##########################################################################
      # Wait for Redis
      ##########################################################################

      - name: Wait for Redis

        run: |

          set -euo pipefail

          echo "Waiting for Redis..."

          for i in {1..60}
          do

            if redis-cli \
              -u "${REDIS_URL}" \
              ping | grep -q PONG
            then

              echo "Redis ready."

              exit 0

            fi

            sleep 2

          done

          echo "ERROR: Redis failed to become ready."

          exit 1

      ##########################################################################
      # Lint
      ##########################################################################

      - name: Backend ESLint

        working-directory: ${{ env.BACKEND_DIR }}

        run: |

          if npm run | grep -q "lint"
          then

            npm run lint

          else

            echo "ERROR: backend lint script is required."

            exit 1

          fi

      ##########################################################################
      # Type validation
      ##########################################################################

      - name: Backend Type Check

        working-directory: ${{ env.BACKEND_DIR }}

        run: |

          if npm run | grep -q "typecheck"
          then

            npm run typecheck

          elif npm run | grep -q "tsc"
          then

            npx tsc --noEmit

          else

            echo "Backend TypeScript validation not configured."

          fi

      ##########################################################################
      # Dependency audit
      ##########################################################################

      - name: Backend Security Audit

        working-directory: ${{ env.BACKEND_DIR }}

        run: |

          npm audit --audit-level=high

      ##########################################################################
      # Database migrations
      ##########################################################################

      - name: Validate Migration Script

        working-directory: ${{ env.BACKEND_DIR }}

        run: |

          node <<'NODE'
          const pkg = require("./package.json");

          if (!pkg.scripts?.migrate) {

            console.error(
              "ERROR: backend/package.json must define migrate."
            );

            process.exit(1);
          }
          NODE

      - name: Run Database Migrations

        working-directory: ${{ env.BACKEND_DIR }}

        run: npm run migrate

      ##########################################################################
      # Optional test database seed
      ##########################################################################

      - name: Seed Test Database

        working-directory: ${{ env.BACKEND_DIR }}

        run: |

          if npm run | grep -q "seed:test"
          then

            npm run seed:test

          elif npm run | grep -q "seed-admin"
          then

            ADMIN_EMAIL="admin@titech-ci.local" \
            ADMIN_PASS="TITECH-CI-${GITHUB_RUN_ID}" \
            ADMIN_FORCE="true" \
            npm run seed-admin --silent

          else

            echo "No test seed script configured."

          fi

      ##########################################################################
      # Canonical backend CI suite
      ##########################################################################

      - name: Run Backend CI Test Suite

        working-directory: ${{ env.BACKEND_DIR }}

        run: |

          if npm run | grep -q "test:ci"
          then

            npm run test:ci

          else

            npm test -- --coverage

          fi

      ##########################################################################
      # Integration tests
      ##########################################################################

      - name: Run Backend Integration Tests

        working-directory: ${{ env.BACKEND_DIR }}

        run: |

          if npm run | grep -q "test:integration"
          then

            npm run test:integration

          else

            echo "No separate integration test script configured."

          fi

      ##########################################################################
      # Build
      ##########################################################################

      - name: Build Backend

        working-directory: ${{ env.BACKEND_DIR }}

        run: |

          if npm run | grep -q "build"
          then

            npm run build

          else

            echo "Backend build script not configured."

          fi

      ##########################################################################
      # Coverage
      ##########################################################################

      - name: Verify Backend Coverage

        working-directory: ${{ env.BACKEND_DIR }}

        run: |

          if test ! -f coverage/coverage-summary.json
          then

            echo "ERROR: backend coverage report missing."

            exit 1

          fi

          node <<'NODE'
          const fs = require("fs");

          const file = "coverage/coverage-summary.json";

          const threshold =
            Number(process.env.COVERAGE_THRESHOLD || 85);

          const data =
            JSON.parse(fs.readFileSync(file, "utf8"));

          const total = data.total;

          const metrics = [
            ["lines", total.lines?.pct],
            ["statements", total.statements?.pct],
            ["functions", total.functions?.pct],
            ["branches", total.branches?.pct]
          ];

          for (const [name, value] of metrics) {

            const numeric = Number(value);

            if (!Number.isFinite(numeric)) {

              console.error(
                `Invalid ${name} coverage value.`
              );

              process.exit(1);
            }

            console.log(`${name}: ${numeric}%`);

            if (numeric < threshold) {

              console.error(
                `Coverage gate failed: ${name}=${numeric}% < ${threshold}%`
              );

              process.exit(1);
            }
          }

          console.log(
            `Backend coverage gate passed at >= ${threshold}%`
          );
          NODE

      ##########################################################################
      # Coverage artifact
      ##########################################################################

      - name: Upload Backend Coverage

        if: ${{ always() }}

        uses: actions/upload-artifact@v4

        with:

          name: backend-coverage-node-${{ matrix.node }}

          path: backend/coverage

          if-no-files-found: ignore

          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

      ##########################################################################
      # Logs
      ##########################################################################

      - name: Upload Backend Logs

        if: ${{ failure() }}

        uses: actions/upload-artifact@v4

        with:

          name: backend-logs-node-${{ matrix.node }}

          path: |
            backend/logs
            backend/*.log

          if-no-files-found: ignore

          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

      ##########################################################################
      # Test reports
      ##########################################################################

      - name: Upload Backend Test Results

        if: ${{ always() }}

        uses: actions/upload-artifact@v4

        with:

          name: backend-test-results-node-${{ matrix.node }}

          path: |
            backend/test-results
            backend/junit.xml

          if-no-files-found: ignore

          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

      ##########################################################################
      # Summary
      ##########################################################################

      - name: Backend Summary

        if: ${{ always() }}

        run: |

          {
            echo "# Backend CI"
            echo ""
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Node | ${{ matrix.node }} |"
            echo "| MongoDB | verified |"
            echo "| Redis | verified |"
            echo "| Dependencies | installed |"
            echo "| ESLint | executed |"
            echo "| Type Check | executed / not configured |"
            echo "| Security Audit | HIGH/CRITICAL blocking |"
            echo "| Migration | executed |"
            echo "| Backend Tests | executed |"
            echo "| Integration Tests | executed / not configured |"
            echo "| Build | executed / not configured |"
            echo "| Coverage | ${COVERAGE_THRESHOLD}% gate |"
            echo "| Artifacts | uploaded |"
          } >> "${GITHUB_STEP_SUMMARY}"

  ##############################################################################
  # 03. COVERAGE AGGREGATION
  ##############################################################################

  coverage:

    name: Coverage Aggregation

    runs-on: ubuntu-latest

    timeout-minutes: 20

    needs:

      - frontend
      - backend

    if: ${{ always() }}

    permissions:

      contents: read

    steps:

      - name: Download Frontend Coverage

        uses: actions/download-artifact@v4

        with:

          pattern: frontend-coverage-*
          merge-multiple: true
          path: coverage/frontend

      - name: Download Backend Coverage

        uses: actions/download-artifact@v4

        with:

          pattern: backend-coverage-*
          merge-multiple: true
          path: coverage/backend

      ##########################################################################
      # Coverage inventory
      ##########################################################################

      - name: Generate Coverage Inventory

        run: |

          mkdir -p reports

          {
            echo "# Coverage Aggregation"
            echo ""
            echo "| Component | Result |"
            echo "|---|---|"
            echo "| Frontend | artifact downloaded |"
            echo "| Backend | artifact downloaded |"
            echo "| Threshold | ${COVERAGE_THRESHOLD}% |"
          } >> "${GITHUB_STEP_SUMMARY}"

          find coverage -maxdepth 3 -type f \
            -print \
            | sort \
            > reports/coverage-files.txt

      ##########################################################################
      # Upload aggregate artifact
      ##########################################################################

      - name: Upload Coverage Aggregate

        uses: actions/upload-artifact@v4

        with:

          name: coverage-aggregate

          path: |
            coverage/**
            reports/coverage-files.txt

          if-no-files-found: ignore

          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

      ##########################################################################
      # Codecov
      ##########################################################################

      - name: Upload Coverage to Codecov

        if: >
          needs.frontend.result == 'success' &&
          needs.backend.result == 'success'

        uses: codecov/codecov-action@v4

        with:

          fail_ci_if_error: false

          directory: coverage

  ##############################################################################
  # 04. ENTERPRISE CI GATE
  #
  # This is the check that should be considered for branch protection.
  ##############################################################################

  verify:

    name: Enterprise CI Verification

    runs-on: ubuntu-latest

    timeout-minutes: 10

    needs:

      - frontend
      - backend
      - coverage

    if: ${{ always() }}

    permissions:

      contents: read

    steps:

      - name: Evaluate CI Results

        env:

          FRONTEND_RESULT: ${{ needs.frontend.result }}

          BACKEND_RESULT: ${{ needs.backend.result }}

          COVERAGE_RESULT: ${{ needs.coverage.result }}

        run: |

          set -euo pipefail

          echo "Frontend: ${FRONTEND_RESULT}"
          echo "Backend: ${BACKEND_RESULT}"
          echo "Coverage: ${COVERAGE_RESULT}"

          FAILURES=()

          if [[ "${FRONTEND_RESULT}" != "success" ]]
          then
            FAILURES+=("Frontend")
          fi

          if [[ "${BACKEND_RESULT}" != "success" ]]
          then
            FAILURES+=("Backend")
          fi

          if [[ "${COVERAGE_RESULT}" != "success" ]]
          then
            FAILURES+=("Coverage")
          fi

          if (( ${#FAILURES[@]} > 0 ))
          then

            echo ""
            echo "ENTERPRISE CI GATE FAILED."

            printf 'Failed component: %s\n' "${FAILURES[@]}"

            exit 1

          fi

          echo ""
          echo "ENTERPRISE CI GATE PASSED."

      ##########################################################################
      # Final summary
      ##########################################################################

      - name: Publish Enterprise CI Summary

        if: ${{ always() }}

        run: |

          {
            echo "# TITech Community Capital Enterprise CI"
            echo ""
            echo "| Component | Result |"
            echo "|---|---|"
            echo "| Frontend | ${{ needs.frontend.result }} |"
            echo "| Backend | ${{ needs.backend.result }} |"
            echo "| Coverage | ${{ needs.coverage.result }} |"
            echo "| Overall Gate | ${{ job.status }} |"
            echo ""
            echo "## Canonical Project Structure"
            echo ""
            echo "- backend/"
            echo "- frontend/"
            echo ""
            echo "Node Version: ${NODE_VERSION}"
            echo "Commit: ${GITHUB_SHA}"
            echo "Ref: ${GITHUB_REF_NAME}"
            echo "Run: ${GITHUB_RUN_NUMBER}"
          } >> "${GITHUB_STEP_SUMMARY}"